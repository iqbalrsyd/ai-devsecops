# Semgrep custom rules for IoT MQTT/TLS security.
# This file is enabled by scan_directives.py for detected_domain='iot'.

rules:

  # =========================================================================
  # MQTT broker security
  # =========================================================================

  - id: iot-mqtt-cleartext
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      MQTT broker connection over cleartext (mqtt://). All
      device-to-broker communication must use TLS (mqtts://).
      OWASP IoT Top 10 I3: Insecure Network Services.
    metadata:
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp-iot: "I3 Insecure Network Services"
    patterns:
      - pattern-either:
          - pattern: |
              $CLIENT.connect("mqtt://.../*", ...)
          - pattern: |
              mqtt.Client().connect("mqtt://.../*")
          - pattern: |
              paho.mqtt.client.Client().connect("mqtt://.../*")

  - id: iot-mqtt-default-credentials
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      Default MQTT credentials detected. Default credentials are the
      #1 IoT attack vector. Always require unique device credentials
      and rotate them on provisioning.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp-iot: "I1 Weak/Hard-coded Passwords"
    pattern-regex: '"(admin|root|user|device|test):(admin|root|user|device|test|1234|12345|password)"'

  - id: iot-mqtt-no-tls-verify
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      TLS connection with certificate verification disabled. NEVER
      set tls_insecure_set(True) or rejectUnauthorized=false. This
      enables MITM attacks.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      owasp-iot: "I2 Insecure Network Services"
    patterns:
      - pattern-either:
          - pattern: |
              mqtt.Client().tls_set(..., cert_reqs=ssl.CERT_NONE, ...)
          - pattern: |
              $CLIENT.tls_insecure_set(True)

  - id: iot-firmware-path-traversal
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      Firmware path traversal: user-controlled file path used to
      read firmware. Validate against an allowlist of firmware
      version IDs.
    metadata:
      cwe: "CWE-22: Path Traversal"
      owasp-iot: "I3 Insecure Network Services"
    patterns:
      - pattern-either:
          - pattern: |
              $FW = open($REQ.query.firmware, "rb")
          - pattern: |
              fs.readFileSync($REQ.body.firmware_path)
          - pattern: |
              send_file($REQ.args.get("firmware"))

  - id: iot-telemetry-no-encryption
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      Telemetry data sent in cleartext. Sensor data (temperature,
      GPS, biometric) may reveal user behavior or location. Encrypt
      with AES-256-GCM or use TLS.
    metadata:
      cwe: "CWE-311: Missing Encryption of Sensitive Data"
      owasp-iot: "I3 Insecure Network Services"
    patterns:
      - pattern-either:
          - pattern: |
              $MQTT.publish("device/telemetry", $DATA)
          - pattern: |
              $MQTT.publish("sensor/data", $DATA)

  - id: iot-device-auth-bypass
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      Device authentication bypass: device ID is the only auth
      credential. Implement mutual TLS, signed firmware, or device
      certificates.
    metadata:
      cwe: "CWE-287: Improper Authentication"
      owasp-iot: "I1 Weak/Hard-coded Passwords"
    patterns:
      - pattern-either:
          - pattern: |
              $MQTT.publish($REQ.query.device_id + "/command", $CMD)
          - pattern: |
              if ($REQ.headers["x-device-id"] == $KNOWN_DEVICE) { ... }

  - id: iot-default-mqtt-port-public
    languages: [javascript, typescript, python]
    severity: WARNING
    message: >-
      MQTT broker exposed on default port (1883) or public IP. Use
      non-default port (8883 for TLS) and bind to private network.
    metadata:
      cwe: "CWE-668: Exposure of Resource to Wrong Sphere"
      owasp-iot: "I3 Insecure Network Services"
    patterns:
      - pattern-either:
          - pattern: |
              $BROKER = "0.0.0.0"
          - pattern: |
              $BROKER = "tcp://0.0.0.0:1883"

  - id: iot-update-over-plaintext
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      Firmware/software update downloaded over HTTP. Firmware updates
      MUST be downloaded over HTTPS and verified with a signature.
    metadata:
      cwe: "CWE-494: Download of Code Without Integrity Check"
      owasp-iot: "I3 Insecure Network Services"
    patterns:
      - pattern-either:
          - pattern: |
              $URL = "http://.../firmware/.../*"
          - pattern: |
              requests.get("http://.../update.bin")

  # =========================================================================
  # TLS / certificate pinning
  # =========================================================================

  - id: iot-tls-cert-verify-disabled
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      TLS certificate verification disabled (`rejectUnauthorized: false`,
      `verify=False`, `tls_insecure_set(true)`, atau
      `cert_reqs=ssl.CERT_NONE`). MITM attack trivial. OWASP IoT I3.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      owasp-iot: "I3 Insecure Network Services"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              { rejectUnauthorized: false }
          - pattern: |
              {rejectUnauthorized:false}
          - pattern: |
              verify=False
          - pattern: |
              tls_insecure_set(true)
          - pattern: |
              cert_reqs=ssl.CERT_NONE

  - id: iot-mqtt-broker-bind-wildcard
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      MQTT broker di-bind ke `0.0.0.0` atau wildcard interface.
      Device harus bind ke interface spesifik (mis. 192.168.1.1)
      di belakang firewall. Bind 0.0.0.0 → semua network reachable.
      OWASP IoT I3.
    metadata:
      cwe: "CWE-668: Exposure of Resource to Wrong Sphere"
      owasp-iot: "I3 Insecure Network Services"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              $BROKER = "0.0.0.0"
          - pattern: |
              $BROKER = "tcp://0.0.0.0:1883"
          - pattern: |
              bind_address = "0.0.0.0"

  - id: iot-firmware-no-signature-verify
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      Firmware update endpoint tidak verify signature (RSA, ECDSA,
      atau ed25519) sebelum flashing. Attacker bisa MITM update
      lalu flash malicious firmware ke device. OWASP IoT I9.
    metadata:
      cwe: "CWE-494: Download of Code Without Integrity Check"
      owasp-iot: "I9 Insecure Default Settings"
      ai-devsecops-source: iot-mqtt.yml
    pattern-regex: '(?:update_firmware|ota_update|flash_firmware|installUpdate)\s*\('

  - id: iot-default-password-in-config
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      Default MQTT / device password hardcoded di config file. Pakai
      per-device unique credentials atau X.509 client certificates.
      OWASP IoT I1.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp-iot: "I1 Weak, Hard-coded, or Guessable Passwords"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              password: "admin"
          - pattern: |
              password: "password"
          - pattern: |
              password: "1234"
          - pattern: |
              password: "mqtt"
          - pattern: |
              MQTT_PASSWORD = "admin"

  - id: iot-sensor-data-no-encryption
    languages: [javascript, typescript, python]
    severity: WARNING
    message: >-
      Sensor / telemetry data dikirim ke cloud tanpa encryption
      (HTTP POST, plaintext MQTT). Sensor data bisa dipakai untuk
      fingerprinting / surveillance. Pakai HTTPS / TLS MQTT.
      OWASP IoT I3.
    metadata:
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp-iot: "I3 Insecure Network Services"
      ai-devsecops-source: iot-mqtt.yml
    pattern-regex: '(?:fetch|axios|requests)\.\s*(?:post|put)\s*\(\s*["'']http://'

  - id: iot-telnet-enabled
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      Telnet (port 23) atau unsecured serial console dipakai untuk
      device management. Pakai SSH (port 22) dengan key-based auth.
      OWASP IoT I3.
    metadata:
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp-iot: "I3 Insecure Network Services"
      ai-devsecops-source: iot-mqtt.yml
    pattern-regex: 'telnet\.open\s*\(|telnetlib\.Telnet\s*\('

  - id: iot-debug-interface-exposed
    languages: [javascript, typescript, python]
    severity: WARNING
    message: >-
      Debug interface (JTAG, SWD, UART, atau REPL server) di-expose
      di production firmware. Disable sebelum ship. OWASP IoT I9.
    metadata:
      cwe: "CWE-489: Active Debug Code"
      owasp-iot: "I9 Insecure Default Settings"
      ai-devsecops-source: iot-mqtt.yml
    pattern-regex: '(?:jtag_open|swd_open|openocd|pyocd|REPL\.server|debug_uart)'

  - id: iot-device-id-as-only-auth
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      Device authentication hanya pakai device_id (MAC address / serial
      number) tanpa cryptographic credential. Attacker bisa spoof
      device_id. Pakai mTLS / X.509 / JWT. OWASP IoT I1.
    metadata:
      cwe: "CWE-287: Improper Authentication"
      owasp-iot: "I1 Weak, Hard-coded, or Guessable Passwords"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              if ($REQ.headers["x-device-id"]) { ... }
          - pattern: |
              if ($REQ.headers["device-id"]) { ... }
          - pattern: |
              if ($DEVICE_ID == $REQ.headers["device-id"]) { ... }
      - pattern-not: |
          if verify_signature($REQ, $DEVICE_KEY):

  - id: iot-overall-tls-required
    languages: [javascript, typescript, python]
    severity: WARNING
    message: >-
      Insecure protocol (HTTP, FTP, Telnet) dipakai untuk IoT
      communication. Pakai HTTPS, SFTP, atau SSH. OWASP IoT I3.
    metadata:
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp-iot: "I3 Insecure Network Services"
      ai-devsecops-source: iot-mqtt.yml
    pattern-regex: '\b(?:ftp|telnet)\.(?:get|put|connect|open)\s*\('

  # =========================================================================
  # JAVA / SPRING BOOT SPECIFIC (untuk ThingsBoard / IoT platform)
  # Justifikasi: ground truth repo (ThingsBoard v4.0.2) pakai Java/Spring
  # Boot. Rules di bawah target CVE:
  #   - CVE-2025-34282 (SSRF via SVG, 9.1, fixed v4.2.1)
  #   - CVE-2025-34281 (XSS via SVG, 5.4)
  #   - CVE-2025-9094  (Gateway input, 4.3)
  #   - CVE-2024-55466 (file upload, 6.5)
  # =========================================================================

  - id: iot-java-image-upload-no-extension-validation
    languages: [java]
    severity: ERROR
    message: >-
      Image upload handler tidak validasi ekstensi file. ThingsBoard
      CVE-2025-34282: SVG upload tanpa validasi → SSRF via `<image href>`
      fetching internal network. CVE-2025-34281: stored XSS via SVG `<script>`.
      Selalu whitelist ekstensi (jpg, png) dan reject SVG dari upload
      user-generated. OWASP IoT I10.
    metadata:
      cwe: "CWE-434: Unrestricted Upload of File with Dangerous Type"
      cve: "CVE-2025-34282, CVE-2025-34281, CVE-2024-55466"
      owasp-iot: "I10 Lack of Device Management"
      ai-devsecops-source: iot-mqtt.yml
    pattern-either:
      - pattern: |
          if ($NAME.endsWith(".svg")) { ... }
      - patterns:
          - pattern-either:
              - pattern: |
                  $TYPE.equals($EXT)
              - pattern: |
                  String $EXT = $FILENAME.substring($FILENAME.lastIndexOf("."));
                  ...
                  $TYPE.equals($EXT)
          - metavariable-regex:
              metavariable: $EXT
              regex: '.*\.(svg|html|htm|xml|js)'

  - id: iot-java-svg-upload-allowed
    languages: [java]
    severity: ERROR
    message: >-
      Upload handler menerima SVG file. SVG bisa berisi `<script>`
      (XSS) atau `<image href="http://internal/">` (SSRF). ThingsBoard
      CVE-2025-34282 (SSRF 9.1) + CVE-2025-34281 (XSS 5.4) di image
      gallery. Reject .svg di upload handler. OWASP IoT I10.
    metadata:
      cwe: "CWE-434: Unrestricted Upload of File with Dangerous Type"
      cve: "CVE-2025-34282, CVE-2025-34281"
      owasp-iot: "I10 Lack of Device Management"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              $ALLOWED.add(".svg")
          - pattern: |
              $ALLOWED.add("image/svg+xml")
          - pattern: |
              if ($EXT.equalsIgnoreCase("svg")) { ... save ... }
          - pattern: |
              case "svg": $CONTROLLER.save(...)

  - id: iot-java-ssrf-image-fetch-no-allowlist
    languages: [java]
    severity: ERROR
    message: >-
      URL fetch di image processing tanpa validasi allowlist domain.
      ThingsBoard CVE-2025-34282: SVG `<image href="http://internal:8086">`
      dieksekusi saat SVG di-parse untuk preview. Selalu validate URL
      terhadap allowlist domain (CDN internal only). OWASP IoT I3.
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      cve: "CVE-2025-34282"
      owasp-iot: "I3 Insecure Network Services"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              URL $URL = new URL($X);
              ...
              $IS = $URL.openStream();
          - pattern: |
              $HTTP.newBuilder($X).build()
          - pattern: |
              new URI($X)
          - pattern: |
              HttpClient.newHttpClient().send(...)
      - metavariable-regex:
          metavariable: $X
          regex: '.*(request|user|input|data|param).*'

  - id: iot-java-mqtt-tls-disabled
    languages: [java]
    severity: ERROR
    message: >-
      MQTT broker client tidak pakai TLS. ThingsBoard pakai Eclipse Paho
      untuk MQTT broker internal. Production harus set `ssl://` bukan
      `tcp://`, dengan `setSocketFactory(SSL_CONTEXT.getSocketFactory())`.
      Cleartext MQTT = device credentials bocor di network. OWASP IoT I1.
    metadata:
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp-iot: "I1 Weak/Hard-coded Passwords"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: MqttClient($HOST, $PORT, $CLIENT_ID)
          - pattern: new MqttClient($HOST, $PORT, $CLIENT_ID)
          - pattern: MqttClient($URL, $CLIENT_ID)
      - metavariable-regex:
          metavariable: $URL
          regex: '^"tcp://.*"'

  - id: iot-java-freemarker-ssti
    languages: [java]
    severity: ERROR
    message: >-
      Apache FreeMarker template processing dengan input user. Vulnerable
      ke Server-Side Template Injection. CVE-2023-45303 (ThingsBoard
      email templates 8.8). Hindari `?new()`, `?api`, `?interpret` di
      data yang dapat dikontrol user. Gunakan FreeMarker sandbox.
      CWE-94.
    metadata:
      cwe: "CWE-94: Improper Control of Generation of Code"
      cve: "CVE-2023-45303"
      owasp: "A03:2021 Injection"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              $TEMPLATE.process($DATA, $OUT)
              ...
          - pattern: |
              Configuration $CFG = new Configuration($VER);
              ...
              $TEMPLATE.process($DATA, $OUT);
          - pattern: |
              $ENV.process($DATA)
          - pattern: |
              freemarker.template.utility.Execute
      - metavariable-regex:
          metavariable: $DATA
          regex: '.*(request|user|input|data|param).*'

  - id: iot-java-spring-security-tenant-bypass
    languages: [java]
    severity: ERROR
    message: >-
      Spring Security endpoint yang tidak enforce tenant isolation.
      ThingsBoard multi-tenant: setiap user/role terikat ke tenant_id.
      CVE-2022-48341 (privilege escalation 8.8) + CVE-2022-45608 (vertical
      privilege escalation 8.8): attacker modify `scopes` parameter
      untuk escalate dari tenant_admin ke sys_admin. Selalu check
      `@PreAuthorize("hasAuthority('SYS_ADMIN')")` di endpoint yang
      modify user/role. CWE-269.
    metadata:
      cwe: "CWE-269: Improper Privilege Management"
      cve: "CVE-2022-48341, CVE-2022-45608"
      owasp: "A01:2021 Broken Access Control"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              @RequestMapping
              public $RET $METHOD(...)
          - pattern: |
              @PostMapping
              public $RET $METHOD(...)
          - pattern: |
              @GetMapping
              public $RET $METHOD(...)
      - pattern-not: |
          @PreAuthorize
          $ANN
          @RequestMapping
          public $RET $METHOD(...)

  - id: iot-java-hardcoded-jwt-secret
    languages: [java]
    severity: ERROR
    message: >-
      JWT signing key hardcoded. ThingsBoard pakai JJWT untuk sign
      token. Jika key bocor di source = attacker bisa forge admin token.
      Selalu load dari env var. CWE-798.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 Identification and Authentication Failures"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              Keys.hmacShaKeyFor("$SECRET".getBytes())
          - pattern: |
              new SecretKeySpec("$SECRET".getBytes(), "HmacSHA256")
          - pattern: |
              SignatureAlgorithm.HS256
              ...
              $TOKEN = JWT.create().sign(Algorithm.HMAC256("$SECRET"))
      - metavariable-regex:
          metavariable: $SECRET
          regex: '^"(secret|changeme|test|admin|password|jwt|tbkey)'

  - id: iot-java-coap-no-dtls
    languages: [java]
    severity: WARNING
    message: >-
      CoAP server/client pakai Californium tanpa DTLS. CoAP over
      UDP cleartext = device telemetry bocor di network. Production
      harus pakai coaps:// dengan DTLS handshake. OWASP IoT I3.
    metadata:
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp-iot: "I3 Insecure Network Services"
      ai-devsecops-source: iot-mqtt.yml
    pattern: 'new CoapServer(\d+)'

  - id: iot-java-add-gateway-no-validation
    languages: [java]
    severity: ERROR
    message: >-
      Add Gateway endpoint tanpa input validation. CVE-2025-9094
      (ThingsBoard 4.1, Improper neutralization of special elements).
      Selalu validate device name dengan whitelist regex, sanitize
      semua field yang dipakai di system command atau file path.
      CWE-20.
    metadata:
      cwe: "CWE-20: Improper Input Validation"
      cve: "CVE-2025-9094"
      owasp: "A03:2021 Injection"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              @PostMapping("/api/gateway")
              public $RET $METHOD(...)
          - pattern: |
              @RequestMapping("/api/gateway")
              public $RET $METHOD(...)
      - pattern-not: |
          @PreAuthorize("hasAuthority('...") 
          $ANN
          @PostMapping("/api/gateway")
          public $RET $METHOD(...)

  - id: iot-java-firmware-path-traversal
    languages: [java]
    severity: ERROR
    message: >-
      Firmware upload tanpa validasi path. CVE-2023-29203 (ThingsBoard
      path traversal 7.5). Path dari user input dipakai di `new File(...)`
      atau `Paths.get(...)` tanpa normalisasi. Selalu validate
      `normalized.startsWith(baseDir)`. CWE-22.
    metadata:
      cwe: "CWE-22: Path Traversal"
      cve: "CVE-2023-29203"
      owasp: "A01:2021 Broken Access Control"
      ai-devsecops-source: iot-mqtt.yml
    patterns:
      - pattern-either:
          - pattern: |
              new File($PATH + $X)
          - pattern: |
              Paths.get($PATH, $X)
          - pattern: |
              new FileInputStream($PATH + $X)
      - metavariable-regex:
          metavariable: $X
          regex: '.*(firmware|name|filename|input|param).*'
